<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Order Confirmed — LT Finds</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#000;
      --panel:#0b0b12;
      --text:#EAEAEA;
      --muted:#a7a7c2;
      --line:#1e1b2e;
      --purple:#a855f7;
      --purple-2:#7c3aed;
      --radius:16px;
      --shadow:0 10px 30px rgba(0,0,0,.45);
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',system-ui}
    .wrap{min-height:100vh;display:grid;place-items:center;padding:24px}
    .card{max-width:640px;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px}
    h1{margin:0 0 8px;font-size:34px}
    .pill{display:inline-block;padding:8px 12px;border-radius:999px;background:linear-gradient(135deg,rgba(168,85,247,.14),rgba(124,58,237,.22));border:1px solid rgba(168,85,247,.3);font-weight:900}
    .muted{color:var(--muted)}
    .row{display:flex;gap:12px;flex-wrap:wrap;margin-top:14px}
    .box{flex:1;min-width:240px;border:1px solid var(--line);border-radius:14px;padding:14px;background:#0e0e16}
    a.btn{display:inline-block;margin-top:14px;padding:12px 14px;border-radius:12px;background:linear-gradient(135deg,var(--purple),var(--purple-2));color:#0b0014;text-decoration:none;font-weight:900}
    .small{font-size:13px}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>✅ Order Confirmed</h1>
      <p class="muted">Thanks for your order. Keep your order number safe.</p>

      <div class="row">
        <div class="box">
          <div class="muted small">Order Number</div>
          <div id="orderNum" class="pill">Generating…</div>
        </div>
        <div class="box">
          <div class="muted small">Status</div>
          <div id="status" class="pill">Checking payment…</div>
        </div>
      </div>

      <div class="box" style="margin-top:12px">
        <div class="muted small">Instructions</div>
        <div style="margin-top:8px;line-height:1.6">
          If you need support, message <b>Snapchat: ltsells</b> and include your <b>order number</b>.
        </div>
      </div>

      <a class="btn" href="/">Back to store</a>
    </div>
  </div>

  <script>
    // Get session_id from URL
    const params = new URLSearchParams(location.search);
    const session_id = params.get("session_id");

    function fallbackOrder(){
      const rnd = Math.random().toString(36).slice(2, 10).toUpperCase();
      document.getElementById("orderNum").textContent = "LT-" + rnd;
      document.getElementById("status").textContent = "Payment status unknown";
    }

    if(!session_id){
      fallbackOrder();
    } else {
      fetch(`/api/get-session?session_id=${encodeURIComponent(session_id)}`)
        .then(r => r.json())
        .then(data => {
          if(data && data.orderNumber){
            document.getElementById("orderNum").textContent = "LT-" + data.orderNumber;
            document.getElementById("status").textContent = data.paid ? "Paid ✅" : "Not paid ❌";
          } else {
            fallbackOrder();
          }
        })
        .catch(() => fallbackOrder());
    }
  </script>
</body>
</html>
